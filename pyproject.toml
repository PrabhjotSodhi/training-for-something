[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-for-something"
dynamic = ["version"]
description = "A free, open source, local-first coach for one person's goal."
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
dependencies = [
    "fastapi>=0.165.0",
    "mcp>=2.3,<3",
    "qrcode>=8.2",
    "questionary>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
tfs = "tfs.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tfs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tfs = ["**/*.sql", "**/*.json", "**/*.toml", "web/dashboard/**/*"]

[dependency-groups]
dev = ["hypothesis==6.112.0", "ruff==0.6.9"]
