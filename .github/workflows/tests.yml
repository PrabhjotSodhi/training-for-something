name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install hypothesis==6.112.0
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -t . -v; else echo "No tests yet"; fi
