name: tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: sh -n install.sh

  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -t . -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run build
      - run: uv build --wheel
      - run: python3 -c "import glob,zipfile;n='tfs/web/dashboard/index.html';w=glob.glob('dist/*.whl')[0];f=zipfile.ZipFile(w).namelist();assert n in f,n+' is missing from '+w;print(*[x for x in f if x.startswith('tfs/web/dashboard/')],sep='\n')"

  installer-proof:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - run: sh install.sh < /dev/null; echo "install.sh exit code $?"; "$HOME/.local/bin/tfs" --version; uv --version; uv tool list
      - if: always()
        run: |
          curl -sSi "https://api.github.com/repos/PrabhjotSodhi/training-for-something/releases?per_page=1" | head -c 1200
          curl -fsSL "https://api.github.com/repos/PrabhjotSodhi/training-for-something/releases?per_page=1" | grep -o '"browser_download_url": *"[^"]*[.]whl"'
